name: Backend CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VERCEL: "1"
      PRODUCTION: "true"
      SECRET_KEY: ci-test-secret-not-used-for-production
      DATABASE_URL: sqlite://
      REDIS_URL: redis://127.0.0.1:6379/15
      BACKEND_CORS_ORIGINS: '["https://tube-savely-vue.vercel.app","http://localhost:5173"]'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile and run the test suite
        run: sh scripts/ci-test.sh
